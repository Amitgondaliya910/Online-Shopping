<!-- Online shopping project -->

<!DOCTYPE html>
<html>
<head>
    <title>Products</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body class="bg-light">
    <div class="container mt-4">
        <h2>Search Products</h2>
        <div class="row mb-3">
            <div class="col-md-6">
                <input type="text" id="search" class="form-control" placeholder="Search by Product Name">
            </div>
            <div class="col-md-6">
                <select id="category" class="form-select">
                    <option value="">All Categories</option>
                </select>
            </div>
        </div>
        <div class="row" id="result"></div>

    </div>
    <script>
        // Load Categories (XML)
        $.ajax({
            url: "categories.xml",
            dataType: "xml",
            success: function (data) {
                $(data).find("category").each(function () {
                    let name = $(this).text();
                    $("#category").append(`<option value="${name}">${name}</option>`);
                });
            }
        });
        //Function to Load Products
        function loadProducts() {
            let keyword = $("#search").val().toLowerCase();
            let category = $("#category").val();
            $.getJSON("products.json", function (data) {
                let output = "";
                $.each(data.products, function (i, product) {
                    if (
                        product.name.toLowerCase().includes(keyword) &&
                        (category == "" || product.category == category)
                    ) {
                    output += `
                <div class="col-md-4">
                    <div class="card mb-3">
                        <div class="card-body">
                            <img src="${product.image}" class="card-img-top" height="200" width="200" alt="${product.name}">
                            <h5>${product.name}</h5>
                            <p>₹ ${product.price}</p>
                            <a href="product-details.html?id=${product.id}" 
                               class="btn btn-primary">
                               View Details
                            </a>
                        </div>
                    </div>
                </div>`;
                    }
                });
                if (output == "") {
                    output = "<p class='text-danger'>No Products Found</p>";
                }
                $("#result").html(output);
            });
        }
        // Page Load pe sab products show karo
        $(document).ready(function () {
            loadProducts();
        });
        // Search & Category change
        $("#search, #category").on("keyup change", function () {
            loadProducts();
        });
    </script>
</body>
</html>
